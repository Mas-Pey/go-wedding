<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/e.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Digital Invitation Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ef4444',
            secondary: '#1e293b'
          },
          borderRadius: {
            'none': '0px',
            'sm': '4px',
            DEFAULT: '8px',
            'md': '12px',
            'lg': '16px',
            'xl': '20px',
            '2xl': '24px',
            '3xl': '32px',
            'full': '9999px',
            'button': '8px'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="css/remixicon.min.css" rel="stylesheet">
  <style>
    :where([class^="ri-"])::before { content: "\f3c2"; }
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="bg-slate-900 text-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-3 mb-4">
        <div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-xl">K</span>
        </div>
        <span class="font-['Pacifico'] text-2xl text-white">Kadaku</span>
      </div>
      <h1 class="text-2xl font-bold text-white mb-2">Welcome Back</h1>
      <p class="text-slate-400">Sign in to your account to continue</p>
    </div>
    
    <div class="bg-slate-800 rounded-lg p-8 border border-slate-700">
      <form id="loginForm">
        <div class="mb-6">
          <label class="block text-slate-300 text-sm font-medium mb-2" for="email">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-mail-line text-slate-400"></i>
            </div>
            <input 
              id="email" 
              type="email" 
              class="w-full bg-slate-700 border border-slate-600 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
              placeholder="you@example.com"
              required
            >
          </div>
        </div>
        
        <div class="mb-6">
          <div class="flex items-center justify-between mb-2">
            <label class="block text-slate-300 text-sm font-medium" for="password">
              Password
            </label>
            <a href="#" class="text-sm text-primary hover:text-red-600">Forgot password?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-lock-line text-slate-400"></i>
            </div>
            <input 
              id="password" 
              type="password" 
              class="w-full bg-slate-700 border border-slate-600 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
              placeholder="••••••••"
              required
            >
          </div>
        </div>
        
        <div class="flex items-center mb-6">
          <input 
            id="remember" 
            type="checkbox" 
            class="w-4 h-4 text-primary bg-slate-700 border-slate-600 rounded focus:ring-primary focus:ring-2"
          >
          <label for="remember" class="ml-2 text-sm text-slate-300">
            Remember me
          </label>
        </div>
        
        <button 
          type="submit" 
          class="w-full bg-primary hover:bg-red-600 text-white py-3 rounded-lg font-medium transition-colors mb-6"
        >
          Sign In
        </button>
        
        <div class="text-center">
          <p class="text-slate-400 text-sm">
            Don't have an account? 
            <a href="register.html" class="text-primary hover:text-red-600 font-medium">Sign up</a>
          </p>
        </div>
      </form>
    </div>
    
    <div class="mt-8 text-center">
      <p class="text-slate-500 text-sm">
        © 2025 Weddingsaas. All rights reserved.
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm')
    form.addEventListener('submit', async function(event) {
      event.preventDefault()

      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      const data = {
        email: email,
        pw: password,
      }

      try{
        const response = await fetch('http://localhost:8080/sign-in', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        })

        const result = await response.json()

        if (response.ok) {
          localStorage.setItem('token', result.token)
          alert (result.message)
          window.location.href = 'index.html'
        } else {
          alert(result.error)
        }
      } catch (error) {
        alert("Failed to connect server")
      }
    })
  </script>
</body>
</html>
