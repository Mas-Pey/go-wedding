<!DOCTYPE html>
<html lang="en">

<head>
  <script src="js/e.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Digital Invitation Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ef4444',
            secondary: '#1e293b'
          },
          borderRadius: {
            'none': '0px',
            'sm': '4px',
            DEFAULT: '8px',
            'md': '12px',
            'lg': '16px',
            'xl': '20px',
            '2xl': '24px',
            '3xl': '32px',
            'full': '9999px',
            'button': '8px'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="css/remixicon.min.css" rel="stylesheet">
  <style>
    :where([class^="ri-"])::before {
      content: "\f3c2";
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body class="bg-slate-900 text-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-3 mb-4">
        <div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-xl">K</span>
        </div>
        <span class="font-['Pacifico'] text-2xl text-white">Kadaku</span>
      </div>
      <h1 class="text-2xl font-bold text-white mb-2">Create Account</h1>
      <p class="text-slate-400">Sign up to get started with our service</p>
    </div>

    <div class="bg-slate-800 rounded-lg p-8 border border-slate-700">
      <form id="registerForm">
        <div class="mb-6">
          <label class="block text-slate-300 text-sm font-medium mb-2" for="name">
            Full Name
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-user-line text-slate-400"></i>
            </div>
            <input id="name" type="text"
              class="w-full bg-slate-700 border border-slate-600 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
              placeholder="John Doe" required>
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-slate-300 text-sm font-medium mb-2" for="email">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-mail-line text-slate-400"></i>
            </div>
            <input id="email" type="email"
              class="w-full bg-slate-700 border border-slate-600 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
              placeholder="you@example.com" required>
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-slate-300 text-sm font-medium mb-2" for="password">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-lock-line text-slate-400"></i>
            </div>
            <input id="password" type="password"
              class="w-full bg-slate-700 border border-slate-600 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
              placeholder="••••••••" required>
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-slate-300 text-sm font-medium mb-2" for="confirm-password">
            Confirm Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-lock-line text-slate-400"></i>
            </div>
            <input id="confirm-password" type="password"
              class="w-full bg-slate-700 border border-slate-600 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
              placeholder="••••••••" required>
          </div>
        </div>

        <div class="flex items-start mb-6">
          <div class="flex items-center h-5">
            <input id="terms" type="checkbox"
              class="w-4 h-4 text-primary bg-slate-700 border-slate-600 rounded focus:ring-primary focus:ring-2"
              required>
          </div>
          <label for="terms" class="ml-2 text-sm text-slate-300">
            I agree to the <a href="#" class="text-primary hover:text-red-600">Terms of Service</a> and <a href="#"
              class="text-primary hover:text-red-600">Privacy Policy</a>
          </label>
        </div>

        <button type="submit"
          class="w-full bg-primary hover:bg-red-600 text-white py-3 rounded-lg font-medium transition-colors mb-6">
          Create Account
        </button>

        <div class="text-center">
          <p class="text-slate-400 text-sm">
            Already have an account?
            <a href="login.html" class="text-primary hover:text-red-600 font-medium">Sign in</a>
          </p>
        </div>
      </form>
    </div>

    <div class="mt-8 text-center">
      <p class="text-slate-500 text-sm">
        © 2025 Weddingsaas. All rights reserved.
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm')
    form.addEventListener('submit', async function (event) {
      event.preventDefault()
      const fullname = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      if (password !== confirmPassword) {
        alert("Password do not match!");
        return
      }

      const data = {
        fullname: fullname,
        email: email,
        pw: password
      }

      try {
        const response = await fetch('http://localhost:8080/sign-up', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        })

        const result = await response.json()

        if (response.ok) {
          alert(result.message)
          window.location.href = 'login.html'
        } else {
          alert(result.error)
        }
      } catch (error) {
        alert("Failed to connect server : " + error)
      }
    })
  </script>

</body>

</html>
